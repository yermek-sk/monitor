name: CI Pipeline

on: [push]

jobs:
  # Задача 1: Проверка качества кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linter
        run: pip install flake8

      - name: Run linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Задача 2: Сборка и интеграционный тест БД
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env
        run: |
          echo "DB_USER=postgres" > .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_NAME=monitor_db" >> .env
          echo "TG_TOKEN=dummy" >> .env
          echo "TG_CHAT_ID=0" >> .env

      - name: Build and Run Database
        run: docker compose up -d monitor-db

      - name: Wait for Database
        run: sleep 20

      - name: Run Application
        run: docker compose up -d

      - name: Test Database Connection
        run: |
          # Ждем еще немного для надежности и делаем запрос
          sleep 5
          docker exec monitor-db psql -U postgres -d monitor_db -c "SELECT 1;"
