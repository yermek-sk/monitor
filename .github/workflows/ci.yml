name: CI Pipeline

on: [push]

jobs:
  # Первая задача: Сборка и тест БД
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Create .env
        run: |
          echo "DB_USER=postgres" > .env
          echo "DB_PASSWORD=password" >> .env
          # ... (остальные переменные)
      - name: Build and Run
        run: docker compose up -d
      # ... (остальные шаги теста БД)

  # Вторая задача: Линтер (теперь он внутри jobs!)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install linter
        run: pip install flake8
      - name: Run linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
