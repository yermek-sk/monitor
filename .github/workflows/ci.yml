name: CI Pipeline

on: [push]

jobs:
  # Задача 1: Проверка качества кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linter
        run: pip install flake8

      - name: Run linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Задача 2: Сборка и интеграционный тест БД
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env
        run: |
          echo "DB_USER=postgres" > .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_NAME=monitor_db" >> .env
          echo "TG_TOKEN=dummy" >> .env
          echo "TG_CHAT_ID=0" >> .env

      - name: Build and Run
        run: docker compose up -d

      - name: Wait for Database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..20}; do
            # Проверяем статус здоровья контейнера monitor-db
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' monitor-db 2>/dev/null || echo "not-found")
            if [ "$STATUS" == "healthy" ]; then
              echo "Database is healthy!"
              exit 0
            fi
            echo "Current status: $STATUS. Waiting..."
            sleep 5
          done
          echo "Database failed to become healthy!"
          exit 1

      - name: Test Database Connection
        run: |
          docker exec monitor-db psql -U postgres -d monitor_db -c "SELECT 1;"
